<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mandarin School Bag 3D Packing Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Fredoka', 'Comic Sans MS', sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #e8f5e9; }

        /* MAIN GAME CONTAINER WITH ORANGE/GREEN/WHITE THEME */
        #game-container {
            width: 100vw; height: 100vh; position: relative;
            background: linear-gradient(135deg, #fff3e0 0%, #e8f5e9 50%, #c8e6c9 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 10px; overflow: hidden;
        }

        /* START OVERLAY */
        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(30, 70, 32, 0.9); z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center; padding: 20px;
        }
        #start-btn {
            background: #ff9800; color: white; border: 4px solid #fff;
            padding: 16px 45px; font-size: 1.8rem; font-weight: bold;
            border-radius: 50px; cursor: pointer; box-shadow: 0 8px 0 #e65100;
            margin-top: 20px; transition: transform 0.1s;
        }
        #start-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #e65100; }

        /* HEADER & LEVEL INDICATOR */
        .header-banner {
            background: #ffffff; border: 4px solid #4caf50; border-radius: 25px;
            padding: 8px 25px; color: #e65100; text-align: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1); z-index: 10; margin-top: 5px;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .header-banner h1 { font-size: 1.4rem; color: #ef6c00; }
        .level-badge {
            background: #4caf50; color: white; padding: 2px 14px;
            border-radius: 12px; font-size: 0.9rem; font-weight: bold;
        }

        /* PLAY AREA & 3D BAG */
        .play-area {
            position: relative; width: 100%; max-width: 500px; height: 52vh;
            display: flex; justify-content: center; align-items: center;
            perspective: 1000px;
        }

        .school-bag {
            width: 320px; height: 380px; position: relative;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            border-radius: 40px 40px 25px 25px;
            border: 6px solid #e65100;
            box-shadow: 0 20px 30px rgba(0,0,0,0.2), inset 0 8px 0 rgba(255,255,255,0.4);
            transform: rotateX(8deg);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 15px;
        }

        .bag-handle {
            position: absolute; top: -35px; width: 90px; height: 40px;
            border: 8px solid #e65100; border-bottom: none;
            border-radius: 20px 20px 0 0; background: transparent;
        }
        .bag-pocket {
            position: absolute; bottom: 12px; width: 85%; height: 100px;
            background: #ffb74d; border: 4px solid #e65100; border-radius: 20px;
            box-shadow: inset 0 4px 0 rgba(255,255,255,0.4);
        }
        .bag-badge {
            position: absolute; top: 12px; background: #4caf50; color: white;
            border: 3px solid #2e7d32; padding: 3px 12px; border-radius: 12px;
            font-size: 0.85rem; font-weight: bold;
        }

        /* SHADOW SLOTS GRID */
        .shadow-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            z-index: 5; margin-top: 15px;
        }

        .shadow-slot {
            width: 82px; height: 82px; background: rgba(0, 0, 0, 0.25);
            border: 3px dashed rgba(255, 255, 255, 0.8); border-radius: 18px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; transition: transform 0.2s, border-color 0.2s;
        }
        .shadow-slot.drag-over { transform: scale(1.08); border-color: #81c784; background: rgba(76,175,80,0.3); }

        .shadow-slot .silhouette {
            font-size: 2.3rem; filter: brightness(0) drop-shadow(0 2px 2px rgba(0,0,0,0.4)); opacity: 0.65;
        }

        .shadow-slot.matched {
            border: 3px solid #2e7d32; background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .shadow-slot.matched .silhouette { filter: none; opacity: 1; transform: scale(1.05); }
        
        .shadow-slot .label {
            position: absolute; bottom: -28px; width: 110%; text-align: center;
            font-size: 0.7rem; background: #ffffff; border: 2px solid #4caf50;
            padding: 2px 4px; border-radius: 8px; font-weight: bold; color: #2e7d32;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15); opacity: 0; transition: opacity 0.3s;
            z-index: 20; pointer-events: none; line-height: 1.1;
        }
        .shadow-slot.matched .label { opacity: 1; }

        /* TRAY AT BOTTOM */
        .items-tray {
            width: 95%; max-width: 600px; height: 105px;
            background: #ffffff; border: 4px solid #81c784;
            border-radius: 25px; padding: 8px;
            display: flex; justify-content: space-around; align-items: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); z-index: 10; margin-bottom: 10px;
        }

        .draggable-item {
            width: 68px; height: 68px; background: #fff8e1;
            border: 3px solid #ffa726; border-radius: 18px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: grab; box-shadow: 0 5px 0 #fb8c00, 0 6px 10px rgba(0,0,0,0.1);
            transition: transform 0.15s, box-shadow 0.15s; touch-action: none; position: relative;
        }
        .draggable-item:active { cursor: grabbing; transform: translateY(3px); box-shadow: 0 2px 0 #fb8c00; }
        .draggable-item .icon { font-size: 2.2rem; }

        /* SPARKLE EFFECT */
        .sparkle-particle {
            position: absolute; pointer-events: none; z-index: 3000;
            font-size: 1.4rem; animation: floatAndFade 0.8s ease-out forwards;
        }
        @keyframes floatAndFade {
            0% { opacity: 1; transform: translate(0, 0) scale(0.5) rotate(0deg); }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.5) rotate(180deg); }
        }

        /* MODAL (WIN / LEVEL COMPLETE) */
        #status-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 2000; display: none;
            flex-direction: column; justify-content: center; align-items: center; color: white;
            text-align: center; padding: 20px;
        }
        #status-modal h2 { font-size: 2.5rem; color: #ffd54f; text-shadow: 2px 2px 0 #e65100; margin-bottom: 10px; }
        #status-modal p { font-size: 1.2rem; margin-bottom: 20px; }
        #status-modal button {
            background: #4caf50; border: 4px solid #fff; color: white;
            font-size: 1.4rem; padding: 12px 32px; border-radius: 30px;
            cursor: pointer; box-shadow: 0 6px 0 #1b5e20; font-weight: bold;
        }

        @media (max-width: 500px) {
            .school-bag { width: 280px; height: 340px; }
            .shadow-slot { width: 68px; height: 68px; }
            .shadow-slot .silhouette { font-size: 1.9rem; }
            .draggable-item { width: 56px; height: 56px; }
            .draggable-item .icon { font-size: 1.7rem; }
            .shadow-slot .label { font-size: 0.65rem; bottom: -26px; }
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <h1>🎒 Pack The Bag!</h1>
        <p style="margin-top: 10px; font-size: 1.1rem;">Padankan barang & pelajari Bahasa Mandarin!</p>
        <button id="start-btn" onclick="initGame()">MULA MAIN 🔊</button>
    </div>

    <div id="game-container">
        <div class="header-banner">
            <h1>🎒 装书包 (Kemas Beg Sekolah)</h1>
            <div class="level-badge" id="level-title">Tahap 1 / 3</div>
        </div>

        <div class="play-area">
            <div class="school-bag">
                <div class="bag-handle"></div>
                <div class="bag-badge">书包 (Beg)</div>
                <div class="shadow-grid" id="shadow-grid"></div>
                <div class="bag-pocket"></div>
            </div>
        </div>

        <div class="items-tray" id="items-tray"></div>
    </div>

    <div id="status-modal">
        <h2 id="modal-title">🎉 太棒了!</h2>
        <p id="modal-desc">Tahap Selesai!</p>
        <button id="modal-btn" onclick="nextLevel()">TAHAP SETERUSNYA ➡️</button>
    </div>

    <script>
        // MULTI-LEVEL DATA WITH MALAY TRANSLATIONS
        const levels = [
            {
                title: "Tahap 1: Alat Tulis Basic",
                items: [
                    { id: "book", hanzi: "书", pinyin: "shū", malay: "Buku", icon: "📘" },
                    { id: "pencil", hanzi: "铅笔", pinyin: "qiān bǐ", malay: "Pensel", icon: "✏️" },
                    { id: "ruler", hanzi: "尺子", pinyin: "chǐ zi", malay: "Pembaris", icon: "📏" },
                    { id: "scissors", hanzi: "剪刀", pinyin: "jiǎn dāo", malay: "Gunting", icon: "✂️" },
                    { id: "eraser", hanzi: "橡皮", pinyin: "xiàng pí", malay: "Pemadam", icon: "🧽" },
                    { id: "water", hanzi: "水壶", pinyin: "shuǐ hú", malay: "Botol Air", icon: "🥤" }
                ]
            },
            {
                title: "Tahap 2: Bekalan Bilik Darjah",
                items: [
                    { id: "pen", hanzi: "钢笔", pinyin: "gāng bǐ", malay: "Pen", icon: "🖊️" },
                    { id: "notebook", hanzi: "笔记本", pinyin: "bǐ jì běn", malay: "Buku Nota", icon: "📓" },
                    { id: "crayon", hanzi: "蜡笔", pinyin: "là bǐ", malay: "Krayon", icon: "🖍️" },
                    { id: "glue", hanzi: "胶水", pinyin: "jiāo shuǐ", malay: "Gam", icon: "🧴" },
                    { id: "glasses", hanzi: "眼镜", pinyin: "yǎn jìng", malay: "Cermin Mata", icon: "👓" },
                    { id: "umbrella", hanzi: "雨伞", pinyin: "yǔ sǎn", malay: "Payung", icon: "☂️" }
                ]
            },
            {
                title: "Tahap 3: Makanan & Sukan",
                items: [
                    { id: "apple", hanzi: "苹果", pinyin: "píng guǒ", malay: "Epal", icon: "🍎" },
                    { id: "bento", hanzi: "饭盒", pinyin: "fàn hé", malay: "Bekal Makanan", icon: "🍱" },
                    { id: "ball", hanzi: "皮球", pinyin: "pí qiú", malay: "Bola", icon: "⚽" },
                    { id: "towel", hanzi: "毛巾", pinyin: "máo jīn", malay: "Tuala", icon: "🥢" },
                    { id: "cap", hanzi: "帽子", pinyin: "mào zi", malay: "Topi", icon: "🧢" },
                    { id: "clock", hanzi: "闹钟", pinyin: "nào zhōng", malay: "Jam Loceng", icon: "⏰" }
                ]
            }
        ];

        let currentLevelIdx = 0;
        let matchedCount = 0;
        let globalAudio = new Audio();
        let draggedId = null;

        function initGame() {
            document.getElementById('start-overlay').style.display = 'none';
            globalAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==";
            globalAudio.play().catch(()=>{});
            loadLevel(0);
        }

        function loadLevel(idx) {
            currentLevelIdx = idx;
            matchedCount = 0;
            const currentLevel = levels[currentLevelIdx];

            document.getElementById('level-title').innerText = `Tahap ${currentLevelIdx + 1} / ${levels.length}: ${currentLevel.title}`;

            const shadowGrid = document.getElementById('shadow-grid');
            const itemsTray = document.getElementById('items-tray');
            shadowGrid.innerHTML = '';
            itemsTray.innerHTML = '';

            // Render Target Shadow Slots
            currentLevel.items.forEach(item => {
                const slot = document.createElement('div');
                slot.className = 'shadow-slot';
                slot.dataset.id = item.id;
                slot.innerHTML = `
                    <div class="silhouette">${item.icon}</div>
                    <div class="label">${item.hanzi} (${item.pinyin})<br>${item.malay}</div>
                `;
                
                slot.addEventListener('dragover', handleDragOver);
                slot.addEventListener('dragleave', handleDragLeave);
                slot.addEventListener('drop', handleDrop);

                shadowGrid.appendChild(slot);
            });

            // Shuffle Items for Tray
            const shuffledItems = [...currentLevel.items].sort(() => Math.random() - 0.5);

            shuffledItems.forEach(item => {
                const itemEl = document.createElement('div');
                itemEl.className = 'draggable-item';
                itemEl.draggable = true;
                itemEl.dataset.id = item.id;
                itemEl.id = `drag-${item.id}`;
                itemEl.innerHTML = `<div class="icon">${item.icon}</div>`;

                itemEl.addEventListener('dragstart', handleDragStart);
                setupTouchEvents(itemEl);

                itemsTray.appendChild(itemEl);
            });
        }

        /* --- DRAG & DROP LOGIC --- */
        function handleDragStart(e) {
            draggedId = this.dataset.id;
            e.dataTransfer.setData('text/plain', this.dataset.id);
        }

        function handleDragOver(e) {
            e.preventDefault();
            this.classList.add('drag-over');
        }

        function handleDragLeave() {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            const droppedId = e.dataTransfer ? e.dataTransfer.getData('text/plain') : draggedId;

            if (droppedId === this.dataset.id && !this.classList.contains('matched')) {
                executeMatch(this, droppedId);
            }
        }

        function executeMatch(slotEl, itemId) {
            const currentItems = levels[currentLevelIdx].items;
            const itemData = currentItems.find(i => i.id === itemId);
            slotEl.classList.add('matched');

            // Hide item from tray
            const trayItem = document.getElementById(`drag-${itemId}`);
            if (trayItem) trayItem.style.visibility = 'hidden';

            // Sparkle Particle Effect
            createSparkles(slotEl);

            // Play Sound
            speakMandarin(itemData.hanzi);

            matchedCount++;
            if (matchedCount === currentItems.length) {
                setTimeout(() => {
                    showLevelCompleteModal();
                }, 1200);
            }
        }

        /* --- SPARKLE EFFECT --- */
        function createSparkles(targetSlot) {
            const rect = targetSlot.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const sparkles = ['✨', '⭐', '🌟', '🎉'];

            for (let i = 0; i < 12; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle-particle';
                sparkle.innerText = sparkles[Math.floor(Math.random() * sparkles.length)];

                const dx = (Math.random() - 0.5) * 160 + 'px';
                const dy = (Math.random() - 0.5) * 160 + 'px';

                sparkle.style.left = `${centerX}px`;
                sparkle.style.top = `${centerY}px`;
                sparkle.style.setProperty('--dx', dx);
                sparkle.style.setProperty('--dy', dy);

                document.body.appendChild(sparkle);

                setTimeout(() => sparkle.remove(), 800);
            }
        }

        /* --- TOUCH EVENTS FOR MOBILE --- */
        function setupTouchEvents(elem) {
            let initialX = 0, initialY = 0;
            let currentX = 0, currentY = 0;

            elem.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                initialX = touch.clientX;
                initialY = touch.clientY;
                draggedId = elem.dataset.id;
                elem.style.zIndex = '1000';
            }, { passive: false });

            elem.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                currentX = touch.clientX - initialX;
                currentY = touch.clientY - initialY;
                elem.style.transform = `translate(${currentX}px, ${currentY}px) scale(1.1)`;
            }, { passive: false });

            elem.addEventListener('touchend', (e) => {
                elem.style.transform = 'none';
                elem.style.zIndex = '1';

                const touch = e.changedTouches[0];
                const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
                const slot = targetEl ? targetEl.closest('.shadow-slot') : null;

                if (slot && slot.dataset.id === draggedId && !slot.classList.contains('matched')) {
                    executeMatch(slot, draggedId);
                }
            });
        }

        /* --- SOUND ENGINE (TTS) --- */
        function speakMandarin(textHanzi) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }

            let spokenNative = false;

            if ('speechSynthesis' in window) {
                const voices = window.speechSynthesis.getVoices();
                const chineseVoice = voices.find(v => v.lang.includes('zh') || v.lang.includes('CN') || v.name.toLowerCase().includes('chinese'));

                if (chineseVoice) {
                    const msg = new SpeechSynthesisUtterance(textHanzi);
                    msg.voice = chineseVoice;
                    msg.lang = 'zh-CN';
                    msg.rate = 0.85;
                    window.speechSynthesis.speak(msg);
                    spokenNative = true;
                }
            }

            if (!spokenNative) {
                const encodedText = encodeURIComponent(textHanzi);
                globalAudio.src = `https://dict.youdao.com/dictvoice?audio=${encodedText}&type=1`;
                globalAudio.play().catch(() => {
                    globalAudio.src = `https://tts.baidu.com/text2audio?tex=${encodedText}&cuid=baike&lan=ZH&ctp=1&padd=&spd=4`;
                    globalAudio.play().catch(err => console.log("Audio Error:", err));
                });
            }
        }

        /* --- MODAL CONTROL --- */
        function showLevelCompleteModal() {
            const modal = document.getElementById('status-modal');
            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');
            const btn = document.getElementById('modal-btn');

            if (currentLevelIdx < levels.length - 1) {
                title.innerText = "🎉 太棒了! (Sangat Bagus!)";
                desc.innerText = `Tahap ${currentLevelIdx + 1} Berjaya Dibereskan!`;
                btn.innerText = "TAHAP SETERUSNYA ➡️";
            } else {
                title.innerText = "🏆 恭喜! (Tahniah!)";
                desc.innerText = "Anda telah melengkapkan SEMUA Tahap!";
                btn.innerText = "MAIN SEMULA 🔄";
            }
            modal.style.display = 'flex';
        }

        function nextLevel() {
            document.getElementById('status-modal').style.display = 'none';
            if (currentLevelIdx < levels.length - 1) {
                loadLevel(currentLevelIdx + 1);
            } else {
                loadLevel(0);
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }
    </script>
</body>
</html>
